<main class="page-shell">
  <div class="page-header">
    <h2 class="page-title"><i class="fas fa-book" aria-hidden="true"></i> Historique de {{ book.bookName }}</h2>
    <p class="page-subtitle">Suivi des emprunts liés à cet ouvrage.</p>
  </div>

  <div *ngIf="!borrow || borrow.length === 0" class="empty-state">
    <i class="fas fa-inbox empty-icon" aria-hidden="true"></i>
    Aucun emprunt enregistré pour ce livre.
  </div>

  <div *ngIf="borrow && borrow.length > 0" class="table-container">
    <table class="table table-striped responsive-table-card">
      <thead>
        <tr>
          <th>Utilisateur</th>
          <th>Date emprunt</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let borrower of borrow" class="fade-in">
          <td data-label="Utilisateur"><span class="cell-strong">{{ borrower.userId }}</span></td>
          <td data-label="Date emprunt">{{ borrower.issueDate }}</td>
          <td data-label="Statut">
            <span class="badge" [ngClass]="borrower.returnDate ? 'badge-available' : 'badge-borrowed'">
              <i class="fas" [ngClass]="borrower.returnDate ? 'fa-check-circle' : 'fa-clock'" aria-hidden="true"></i>
              {{ borrower.returnDate ? ('Rendu le ' + borrower.returnDate) : 'Non rendu' }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
