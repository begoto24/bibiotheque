<main class="page-shell">
  <div class="page-header">
    <h2 class="page-title"><i class="fas fa-book" aria-hidden="true"></i> Liste des livres</h2>
    <p class="page-subtitle">Consultez, modifiez et supprimez les ouvrages disponibles.</p>
  </div>

  <app-create-book (bookCreated)="getBooks()"></app-create-book>

  <app-table-state
    [loading]="loading"
    [error]="error"
    [empty]="!loading && !error && filteredBooks.length === 0"
    loadingLabel="Chargement des livres..."
    [emptyIcon]="books.length === 0 ? 'fa-book-open' : 'fa-magnifying-glass'"
    [emptyLabel]="books.length === 0 ? 'Aucun livre trouvé.' : 'Aucun résultat pour cette recherche.'"
    (retry)="getBooks()">
    <app-button *ngIf="books.length === 0" empty-action variant="primary" icon="fa-plus" (clicked)="createBookForm.openModal()">Ajouter un livre</app-button>

    <table class="table table-striped responsive-table-card">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Auteur</th>
          <th>Genre</th>
          <th>Disponibilité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of filteredBooks" class="fade-in">
          <td data-label="Nom"><span class="cell-strong">{{ book.bookName }}</span></td>
          <td data-label="Auteur">{{ book.bookAuthor }}</td>
          <td data-label="Genre"><app-badge variant="genre">{{ book.bookGenre }}</app-badge></td>
          <td data-label="Disponibilité">
            <app-badge
              [variant]="book.noOfCopies > 0 ? 'available' : 'overdue'"
              [icon]="book.noOfCopies > 0 ? 'fa-check-circle' : 'fa-times-circle'">
              {{ book.noOfCopies > 0 ? (book.noOfCopies + ' dispo.') : 'Épuisé' }}
            </app-badge>
          </td>
          <td data-label="Actions">
            <div class="action-group">
              <app-button variant="success" size="sm" icon="fa-eye" (clicked)="bookDetails(book.bookId)">Voir</app-button>
              <app-button variant="secondary" size="sm" icon="fa-edit" (clicked)="updateBook(book.bookId)">Modifier</app-button>
              <app-button variant="danger" size="sm" icon="fa-trash" (clicked)="askDeleteBook(book)">Supprimer</app-button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </app-table-state>

  <app-confirm-dialog
    [open]="!!bookPendingDeletion"
    variant="danger"
    title="Supprimer ce livre ?"
    [message]="'« ' + (bookPendingDeletion?.bookName || '') + ' » sera définitivement supprimé du catalogue. Cette action est irréversible.'"
    confirmLabel="Supprimer"
    cancelLabel="Annuler"
    (confirmed)="confirmDeleteBook()"
    (cancelled)="cancelDeleteBook()">
  </app-confirm-dialog>
</main>
