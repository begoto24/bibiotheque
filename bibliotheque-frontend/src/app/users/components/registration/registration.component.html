<app-button variant="primary" icon="ph-user-plus" (clicked)="openModal()">Ajouter un utilisateur</app-button>

<div
  *ngIf="isModalOpen"
  class="modal-backdrop"
  role="presentation"
  (click)="closeModal()">
  <form
    class="modal-card fade-in"
    #userForm="ngForm"
    (ngSubmit)="onSubmit(userForm)"
    autocomplete="off"
    role="dialog"
    aria-modal="true"
    aria-labelledby="createUserModalTitle"
    tabindex="-1"
    (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title" id="createUserModalTitle">
        <i class="ph ph-user-plus" aria-hidden="true"></i> Ajouter un utilisateur
      </h3>
      <button type="button" class="modal-close" (click)="closeModal()" aria-label="Fermer">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </div>

    <div class="modal-progress" *ngIf="submitting"></div>

    <div class="modal-body">
      <app-form-field label="Nom" icon="ph-user" for="name" [invalid]="name.invalid && name.touched">
        <input
          type="text"
          class="form-control"
          [class.is-invalid]="name.invalid && name.touched"
          id="name"
          [(ngModel)]="user.name"
          name="name"
          required
          #name="ngModel">
      </app-form-field>

      <app-form-field label="Username" icon="ph-at" for="username" [invalid]="username.invalid && username.touched">
        <input
          type="text"
          class="form-control"
          [class.is-invalid]="username.invalid && username.touched"
          id="username"
          [(ngModel)]="user.username"
          name="username"
          required
          #username="ngModel">
      </app-form-field>

      <app-form-field label="Mot de passe" icon="ph-lock" for="password" [invalid]="password.invalid && password.touched">
        <input
          type="password"
          class="form-control"
          [class.is-invalid]="password.invalid && password.touched"
          id="password"
          [(ngModel)]="user.password"
          name="password"
          required
          #password="ngModel">
      </app-form-field>

      <app-form-field label="Rôle" icon="ph-identification-badge" for="role">
        <app-select id="role" [options]="roleOptions" [(ngModel)]="user.role[0].roleName" name="role"></app-select>
      </app-form-field>

      <div *ngIf="successMessage" class="alert alert-success mb-0">
        <i class="ph ph-check-circle" aria-hidden="true"></i> {{ successMessage }}
      </div>

      <div *ngIf="error" class="alert alert-danger mb-0">
        <i class="ph ph-warning-circle" aria-hidden="true"></i> {{ error }}
      </div>
    </div>

    <div class="modal-footer">
      <app-button variant="outline" type="button" (clicked)="closeModal()">Annuler</app-button>
      <app-button variant="success" type="submit" icon="ph-floppy-disk" [loading]="submitting" loadingText="Enregistrement...">Enregistrer</app-button>
    </div>
  </form>
</div>
