<header class="topbar">
  <div class="topbar-search">
    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
    <input
      type="search"
      class="topbar-search-input"
      placeholder="Rechercher un livre, un utilisateur..."
      [value]="searchQuery"
      (input)="onSearchInput($any($event.target).value)"
      aria-label="Rechercher">
  </div>

  <div class="topbar-profile" *ngIf="isLoggedIn(); else loginLink">
    <button
      class="profile-chip"
      type="button"
      aria-haspopup="menu"
      [attr.aria-expanded]="isProfileMenuOpen"
      (click)="toggleProfileMenu()">
      <i class="ph ph-user-circle" aria-hidden="true"></i>
      <span>{{ getUserName() }}</span>
      <i class="ph ph-caret-down profile-chip-caret" [class.profile-chip-caret--open]="isProfileMenuOpen" aria-hidden="true"></i>
    </button>

    <div class="profile-menu" role="menu" *ngIf="isProfileMenuOpen">
      <button class="profile-menu-item" type="button" role="menuitem" (click)="logout()">
        <i class="ph ph-sign-out" aria-hidden="true"></i> <span>Déconnexion</span>
      </button>
    </div>
  </div>

  <ng-template #loginLink>
    <a class="btn btn-outline btn-sm" routerLink="/login">
      <i class="ph ph-sign-in" aria-hidden="true"></i> Connexion
    </a>
  </ng-template>
</header>
