<!-- Barre compacte visible uniquement en dessous de 992px : logo + bouton menu -->
<header class="mobile-topbar">
  <button class="mobile-menu-btn" type="button" (click)="toggleMenu()" aria-label="Ouvrir le menu" aria-controls="appSidebar" [attr.aria-expanded]="!isCollapsed">
    <i class="fas fa-bars" aria-hidden="true"></i>
  </button>
  <a class="brand-link" routerLink="/home">
    <i class="fas fa-book-open brand-icon" aria-hidden="true"></i>
    <span class="brand-text">Bibliothèque</span>
  </a>
</header>

<div class="sidebar-backdrop" *ngIf="!isCollapsed" (click)="closeMenu()"></div>

<aside class="sidebar" id="appSidebar" [ngClass]="{ 'sidebar--open': !isCollapsed, 'sidebar--rail': isRailCollapsed }">
  <div class="sidebar-brand">
    <a class="brand-link" routerLink="/home" (click)="closeMenu()" [title]="isRailCollapsed ? 'Bibliothèque' : ''">
      <i class="fas fa-book-open brand-icon" aria-hidden="true"></i>
      <span class="brand-text">Bibliothèque</span>
    </a>
    <button class="sidebar-close" type="button" (click)="closeMenu()" aria-label="Fermer le menu">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <button
      class="sidebar-toggle"
      type="button"
      (click)="toggleRail()"
      [attr.aria-expanded]="!isRailCollapsed"
      [attr.aria-label]="isRailCollapsed ? 'Agrandir le menu' : 'Réduire le menu'"
      [title]="isRailCollapsed ? 'Agrandir le menu' : 'Réduire le menu'">
      <i class="fas" [ngClass]="isRailCollapsed ? 'fa-angles-right' : 'fa-angles-left'" aria-hidden="true"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a class="sidebar-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()" [title]="isRailCollapsed ? 'Tableau de bord' : ''">
      <i class="fas fa-gauge-high" aria-hidden="true"></i> <span>Tableau de bord</span>
    </a>

    <ng-container *ngIf="isLoggedIn() && isAdmin()">
      <p class="sidebar-section">Catalogue</p>
      <a class="sidebar-link" routerLink="/books" routerLinkActive="active" (click)="closeMenu()" [title]="isRailCollapsed ? 'Livres' : ''">
        <i class="fas fa-book" aria-hidden="true"></i> <span>Livres</span>
      </a>

      <p class="sidebar-section">Comptes</p>
      <a class="sidebar-link" routerLink="/users" routerLinkActive="active" (click)="closeMenu()" [title]="isRailCollapsed ? 'Utilisateurs' : ''">
        <i class="fas fa-users" aria-hidden="true"></i> <span>Utilisateurs</span>
      </a>
    </ng-container>

    <ng-container *ngIf="isLoggedIn()">
      <p class="sidebar-section">Opérations</p>
      <!-- /borrow et /borrow/return sont réservées au rôle User (ADHERENT) :
           un bibliothécaire n'emprunte pas pour lui-même. Les cacher pour lui
           évite un "Accès refusé" systématique au clic. -->
      <ng-container *ngIf="!isAdmin()">
        <a class="sidebar-link" routerLink="/borrow" routerLinkActive="active" (click)="closeMenu()" [title]="isRailCollapsed ? 'Emprunter' : ''">
          <i class="fas fa-hand-holding-heart" aria-hidden="true"></i> <span>Emprunter</span>
        </a>
        <a class="sidebar-link" routerLink="/borrow/return" routerLinkActive="active" (click)="closeMenu()" [title]="isRailCollapsed ? 'Rendre' : ''">
          <i class="fas fa-undo-alt" aria-hidden="true"></i> <span>Rendre</span>
        </a>
      </ng-container>
      <a class="sidebar-link" routerLink="/reservations" routerLinkActive="active" (click)="closeMenu()" [title]="isRailCollapsed ? 'Réservations' : ''">
        <i class="fas fa-calendar-check" aria-hidden="true"></i> <span>Réservations</span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <a *ngIf="!isLoggedIn()" class="sidebar-link" routerLink="/login" routerLinkActive="active" (click)="closeMenu()">
      <i class="fas fa-sign-in-alt" aria-hidden="true"></i> <span>Connexion</span>
    </a>

    <ng-container *ngIf="isLoggedIn()">
      <div class="profile-chip">
        <i class="fas fa-user-circle" aria-hidden="true"></i>
        <span>{{ getUserName() }}</span>
      </div>
      <button class="sidebar-link logout-link" type="button" (click)="logout()">
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i> <span>Déconnexion</span>
      </button>
    </ng-container>
  </div>
</aside>
