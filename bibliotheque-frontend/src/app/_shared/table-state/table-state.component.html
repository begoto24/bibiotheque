<div *ngIf="loading" class="table-container skeleton-table" aria-hidden="true">
  <div class="skeleton-row" *ngFor="let _ of skeletonRows">
    <app-skeleton shape="text" width="8%"></app-skeleton>
    <app-skeleton shape="text" width="26%"></app-skeleton>
    <app-skeleton shape="text" width="18%"></app-skeleton>
    <app-skeleton shape="text" width="14%"></app-skeleton>
    <app-skeleton shape="text" width="20%"></app-skeleton>
  </div>
  <span class="visually-hidden">{{ loadingLabel }}</span>
</div>

<div *ngIf="!loading && error" class="alert alert-danger d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
  <span><i class="ph ph-warning-circle" aria-hidden="true"></i> {{ error }}</span>
  <app-button variant="danger" size="sm" (clicked)="retry.emit()">Réessayer</app-button>
</div>

<div *ngIf="!loading && !error && empty" class="empty-state">
  <i class="ph empty-icon" [ngClass]="emptyIcon" aria-hidden="true"></i>
  <strong>{{ emptyLabel }}</strong>
  <ng-content select="[empty-action]"></ng-content>
</div>

<div *ngIf="!loading && !error && !empty" class="table-container">
  <ng-content></ng-content>
</div>
