<div class="form-field-wrapper">
  <label class="form-label" [attr.for]="for">
    <i *ngIf="icon" class="ph" [ngClass]="icon" aria-hidden="true"></i> {{ label }}
  </label>

  <ng-content></ng-content>

  <div *ngIf="invalid" class="invalid-feedback">
    <i class="ph ph-warning-circle" aria-hidden="true"></i> {{ error }}
  </div>
</div>
